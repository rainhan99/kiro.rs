name: Build Artifacts

# 运行列表默认拿 commit 标题当名字，于是每一行都显示那条提交说了什么，
# 而不是这次构建产出的是哪个版本。这里显式给出。
run-name: >-
  ${{ inputs.version && format('构建 v{0}（手动）', inputs.version)
      || '开发构建 beta（master 推送）' }}

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - 'config.example.json'
      - '.vscode/**'
      - '.idea/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for artifacts (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: read

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        with:
          fetch-depth: 0
      # 版本自增的进位规则有边界（999 进 minor、99 进 major），出错会打出错误的
      # tag。自测很便宜，每次 push 都跑，避免它在无人注意时失效。
      # 上面的 checkout 带条件（仅 push 时执行），workflow_dispatch 下工作目录是空的，
      # 所以这里必须用同一个条件，否则会因为文件不存在而失败。
      - name: Release version self-tests
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          bash scripts/next-version.sh --self-test
          bash scripts/sync-release-version.test.sh

      - name: Check if commit has release tag
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/heads/* ]] && git tag --points-at HEAD | grep -q '^v'; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping beta build: commit already has a release tag"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build-frontend:
    needs: pre-check
    if: needs.pre-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('admin-ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install admin-ui dependencies
        working-directory: admin-ui
        run: bun install --frozen-lockfile

      - name: Build admin-ui
        working-directory: admin-ui
        run: bun run build

      - name: Upload admin-ui dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-dist
          path: admin-ui/dist
          if-no-files-found: error
          retention-days: 1

  build:
    needs:
      - pre-check
      - build-frontend
    if: needs.pre-check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            name: Linux-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            name: Linux-musl-x64
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            name: Linux-musl-arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
            echo "version=${RAW_VERSION#v}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-6)
            echo "version=beta-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Download admin-ui dist
        uses: actions/download-artifact@v4
        with:
          name: admin-ui-dist
          path: admin-ui/dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-${{ matrix.target }}"
          cache-on-failure: true

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup mold linker
        if: contains(matrix.target, 'linux-gnu')
        uses: rui314/setup-mold@v1

      - name: Build app
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'linux-gnu') && '-C link-arg=-fuse-ld=mold' || '' }}
        run: cargo build --release --locked -p kiro-rs --target ${{ matrix.target }} ${{ contains(matrix.target, 'musl') && '--no-default-features' || '' }}

      # run 页面要能自己说清「这是什么、产物在哪、正式发版怎么做」，
      # 否则只能从运行列表的提交标题去猜，而那句话说的是提交、不是构建。
      - name: Summarise this build
        shell: bash
        run: |
          {
            echo "## ${{ matrix.name }} · \`${{ steps.version.outputs.version }}\`"
            echo
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "手动构建，版本由触发时指定。"
            else
              echo "**这是 master 推送的开发构建**，版本号是 \`beta-<短 sha>\`，不是发布版本。"
              echo
              echo "产物在本页的 **Artifacts** 区（不是仓库的 Releases 页面）。"
              echo "要出正式 Release：**Actions → Release → Run workflow**，选 \`level\`"
              echo "（patch / minor / major，或 \`none\` 用 Cargo.toml 里的现值）。"
              echo "只有那个工作流会打标签、建 Release 并挂上产物。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiro-rs-${{ steps.version.outputs.version }}-${{ matrix.name }}
          if-no-files-found: error
          compression-level: 6
          path: |
            target/${{ matrix.target }}/release/kiro-rs
            target/${{ matrix.target }}/release/kiro-rs.exe
