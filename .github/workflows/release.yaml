name: Release

# 标签触发时名字就是标签；手动触发时显示要进哪一位——这两件事看一眼就该知道，
# 不该去翻日志。
run-name: >-
  ${{ github.ref_type == 'tag' && format('发布 {0}', github.ref_name)
      || (inputs.level == 'none' && format('发布 {0}（指定版本）', inputs.version)
          || format('发布（{0} 进位）', inputs.level)) }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      level:
        description: 'Auto-increment the version (x.xx.xxx odometer). Pick "none" to release the version already in Cargo.toml.'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, none]
      version:
        description: 'Explicit version, only used when level is "none" (e.g. 0.1.0 or v0.1.0)'
        required: false
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      target: ${{ steps.meta.outputs.target }}
      has_dockerhub: ${{ steps.dockerhub.outputs.has_dockerhub }}
      bumped_sha: ${{ steps.bump.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Job-level `if` cannot read the secrets context, so presence is probed
      # once here and passed on as a plain boolean. Publishing images is
      # optional: a fork without Docker Hub credentials must still be able to
      # cut a GitHub Release, because that is what in-app self-update reads.
      - name: Detect Docker Hub credentials
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Docker Hub credentials are not configured; image jobs will be skipped and the GitHub Release will still publish."
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      # 版本自增采用里程表式进位（详见 scripts/next-version.sh 与其自测）：
      # patch 每次 +1，满 999 进位到 minor；minor 满 99 进位到 major。
      # 注意 x.xx.xxx 是位数预算而非补零显示——补零的 0.09.001 不是合法 SemVer，
      # Cargo 会直接报 invalid leading zero 拒绝构建。
      - name: Bump version
        id: bump
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.level != 'none' }}
        shell: bash
        env:
          LEVEL: ${{ github.event.inputs.level }}
        run: |
          set -euo pipefail
          bash scripts/next-version.sh --self-test
          CURRENT="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          NEXT="$(bash scripts/next-version.sh "$LEVEL" "$CURRENT")"
          echo "::notice::Version bump: ${CURRENT} -> ${NEXT} (${LEVEL})"

          # 三处版本必须一起改：Cargo.toml 是发布校验的来源，Cargo.lock 里本包的
          # 版本若不同步会让 --locked 构建失败，package.json 决定前端产物版本。
          sed -i "0,/^version = \"${CURRENT}\"/s//version = \"${NEXT}\"/" Cargo.toml
          sed -i "s/^  \"version\": \"${CURRENT}\",/  \"version\": \"${NEXT}\",/" admin-ui/package.json
          python3 - "$CURRENT" "$NEXT" <<'PY'
          import re, sys
          current, nxt = sys.argv[1], sys.argv[2]
          path = "Cargo.lock"
          text = open(path, encoding="utf-8").read()
          # 只改本包自己的条目，不碰任何依赖的版本。
          updated = re.sub(
              r'(\[\[package\]\]\nname = "kiro-rs"\nversion = ")%s(")' % re.escape(current),
              r"\g<1>%s\g<2>" % nxt,
              text,
              count=1,
          )
          if updated == text:
              raise SystemExit("Cargo.lock: kiro-rs %s entry not found; refusing to tag a mismatched lockfile" % current)
          open(path, "w", encoding="utf-8").write(updated)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock admin-ui/package.json
          git commit -m "chore(release): ${NEXT}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate version
        id: meta
        shell: bash
        env:
          # Resolve Docker Hub namespace without referencing secrets, otherwise
          # job outputs would be redacted to an empty string when passed across jobs.
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          REPO_OWNER: ${{ github.repository_owner }}
          BUMPED_VERSION: ${{ steps.bump.outputs.version }}
          BUMPED_SHA: ${{ steps.bump.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BUMPED_VERSION:-}" ]; then
            RAW_VERSION="$BUMPED_VERSION"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
            if [ -z "$RAW_VERSION" ]; then
              echo "::error::level is \"none\", so an explicit version input is required"
              exit 1
            fi
          else
            RAW_VERSION="${GITHUB_REF_NAME}"
            PRERELEASE="false"
          fi

          VERSION="${RAW_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Version must look like 0.1.0, optionally prefixed with v"
            exit 1
          fi
          if [[ "$VERSION" =~ ^20[0-9]{2}\. ]]; then
            echo "::error::Date-based versions are not allowed; use semantic versions like 0.1.0"
            exit 1
          fi

          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match requested release version ($VERSION)"
            exit 1
          fi

          TAG="v${VERSION}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi

          # 自增后 tag 必须落在刚提交的那个 commit 上，而不是工作流启动时的 SHA。
          TARGET="${BUMPED_SHA:-$(git rev-list -n 1 "${TAG}" 2>/dev/null || echo "${GITHUB_SHA}")}"

          NAMESPACE="${DOCKERHUB_NAMESPACE:-$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${NAMESPACE}/kiro-rs" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

          # 这次到底发的是哪个版本、打在哪个提交上，run 页面第一屏就该看得到。
          {
            echo "## 发布 ${TAG}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 版本 | \`${VERSION}\` |"
            echo "| 标签 | \`${TAG}\` |"
            echo "| 打在提交 | \`${TARGET}\` |"
            echo "| 预发布 | ${PRERELEASE} |"
            echo "| 镜像 | \`${NAMESPACE}/kiro-rs:${VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-frontend:
    name: Build admin-ui
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 钉到 prepare 实际发布的那个提交：自增会往分支推一个版本提交，
          # 若这里仍取分支最新，期间任何一次 push 都会让产物与 tag 指向的代码不一致。
          ref: ${{ needs.prepare.outputs.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('admin-ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install admin-ui dependencies
        working-directory: admin-ui
        run: bun install --frozen-lockfile

      - name: Build admin-ui
        working-directory: admin-ui
        run: bun run build

      - name: Upload admin-ui dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-dist
          path: admin-ui/dist
          if-no-files-found: error
          retention-days: 1

  build-artifacts:
    name: Build ${{ matrix.name }}
    needs:
      - prepare
      - build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
            archive: tar
            binary: kiro-rs
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
            archive: tar
            binary: kiro-rs
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
            archive: zip
            binary: kiro-rs.exe
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
            archive: tar
            binary: kiro-rs
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            name: Linux-arm64
            archive: tar
            binary: kiro-rs
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            name: Linux-musl-x64
            archive: tar
            binary: kiro-rs
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            name: Linux-musl-arm64
            archive: tar
            binary: kiro-rs

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 钉到 prepare 实际发布的那个提交：自增会往分支推一个版本提交，
          # 若这里仍取分支最新，期间任何一次 push 都会让产物与 tag 指向的代码不一致。
          ref: ${{ needs.prepare.outputs.target }}

      - name: Download admin-ui dist
        uses: actions/download-artifact@v4
        with:
          name: admin-ui-dist
          path: admin-ui/dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-rust-cache-${{ matrix.target }}
          cache-on-failure: true

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup mold linker
        if: contains(matrix.target, 'linux-gnu')
        uses: rui314/setup-mold@v1

      - name: Build app
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'linux-gnu') && '-C link-arg=-fuse-ld=mold' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ contains(matrix.target, 'musl') && '--no-default-features' || '' }}

      - name: Create package directory
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="kiro-rs-${{ needs.prepare.outputs.version }}-${{ matrix.name }}"
          mkdir -p "dist/${PACKAGE}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${PACKAGE}/"
          cp README.md LICENSE "dist/${PACKAGE}/"

      - name: Archive package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="kiro-rs-${{ needs.prepare.outputs.version }}-${{ matrix.name }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "dist/${PACKAGE}.zip" "./dist/${PACKAGE}/*"
          else
            tar -czf "dist/${PACKAGE}.tar.gz" -C dist "${PACKAGE}"
          fi

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.name }}
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-images:
    name: Build and push Docker Hub images
    needs:
      - prepare
      - build-artifacts
    if: needs.prepare.outputs.has_dockerhub == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
            asset: Linux-musl-x64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64
            asset: Linux-musl-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 钉到 prepare 实际发布的那个提交：自增会往分支推一个版本提交，
          # 若这里仍取分支最新，期间任何一次 push 都会让产物与 tag 指向的代码不一致。
          ref: ${{ needs.prepare.outputs.target }}

      - name: Download release asset
        uses: actions/download-artifact@v4
        with:
          name: release-asset-${{ matrix.asset }}
          path: dist

      - name: Stage binary for docker build
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="kiro-rs-${{ needs.prepare.outputs.version }}-${{ matrix.asset }}"
          mkdir -p "artifacts/linux/${{ matrix.arch }}"
          tar -xzf "dist/${PACKAGE}.tar.gz" -C dist
          cp "dist/${PACKAGE}/kiro-rs" "artifacts/linux/${{ matrix.arch }}/kiro-rs"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          build-args: |
            TARGETARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.description=Kiro.rs Docker Image

  publish-image-manifest:
    name: Publish Docker Hub manifest
    needs:
      - prepare
      - build-images
    if: needs.prepare.outputs.has_dockerhub == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ needs.prepare.outputs.image }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          docker manifest create "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:${VERSION}"

          docker manifest create "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:latest"

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build-artifacts
      - publish-image-manifest
    # Images are an optional distribution channel; the GitHub Release is what
    # in-app self-update reads. A skipped or failed image job must not withhold
    # the release, so this depends on the artifacts only and tolerates the rest.
    if: ${{ !cancelled() && needs.build-artifacts.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 钉到 prepare 实际发布的那个提交：自增会往分支推一个版本提交，
          # 若这里仍取分支最新，期间任何一次 push 都会让产物与 tag 指向的代码不一致。
          ref: ${{ needs.prepare.outputs.target }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: release-assets
          merge-multiple: true

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          IMAGE="${{ needs.prepare.outputs.image }}"

          # 优先从 CHANGELOG.md 抽取当前版本的内容（使用 awk 匹配
          # `## [VERSION]` 到下一个 `## ` 之间的段落，去掉首行标题）
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              BEGIN { found = 0 }
              /^## \[/ {
                if (found) exit
                if (index($0, "[" ver "]") > 0) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi

          if [ ! -s RELEASE_NOTES.md ]; then
            cat > RELEASE_NOTES.md <<EOF
          Docker image:

          \`\`\`text
          ${IMAGE}:${VERSION}
          ${IMAGE}:latest
          \`\`\`

          Release assets include \`SHA256SUMS.txt\` for checksum verification.
          EOF
          else
            {
              echo
              echo "---"
              echo
              echo "Docker image:"
              echo
              echo '```text'
              echo "${IMAGE}:${VERSION}"
              echo "${IMAGE}:latest"
              echo '```'
              echo
              echo "Release assets include \`SHA256SUMS.txt\` for checksum verification."
            } >> RELEASE_NOTES.md
          fi

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=()
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${{ needs.prepare.outputs.tag }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --target "${{ needs.prepare.outputs.target }}" \
            --title "Kiro.rs ${{ needs.prepare.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            "${PRERELEASE_ARGS[@]}"

          # 挂上去的到底是哪几个文件，直接列出来——发布成功却没有产物是最难查的一种。
          {
            echo "## 已发布 ${{ needs.prepare.outputs.tag }}"
            echo
            echo "<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}>"
            echo
            echo "### 随发布上传的文件"
            echo '```'
            (cd release-assets && ls -1)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
