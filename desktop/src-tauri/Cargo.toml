[package]
name = "kiro-rs-desktop"
version = "0.9.5"
edition = "2024"
description = "kiro-rs 桌面应用：原生窗口 + 进程内代理"

[lib]
name = "kiro_rs_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "kiro-rs-desktop"
path = "src/main.rs"

[dependencies]
kiro-rs = { path = "../.." , default-features = false }
anyhow = "1"
directories = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies.tauri]
version = "2"
features = []

[dev-dependencies]
tempfile = "3"
serde_json = "1"
